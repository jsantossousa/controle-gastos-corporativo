<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#27272a" stroke-width="4"/>

  <!-- Corporate Card / Wallet Symbol -->
  <g filter="url(#glow)">
    <!-- Main Card Body -->
    <rect x="100" y="148" width="312" height="216" rx="28" fill="#27272a" stroke="#3f3f46" stroke-width="6"/>

    <!-- Accent Header Bar -->
    <path d="M 103 188 L 409 188" stroke="#18181b" stroke-width="32" stroke-linecap="round"/>

    <!-- Emerald Chip / Security Badge -->
    <rect x="140" y="238" width="56" height="42" rx="10" fill="url(#accent)"/>
    
    <!-- Balance / Trend line inside card -->
    <path d="M 230 266 L 270 244 L 310 256 L 366 220" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="366" cy="220" r="8" fill="#34d399"/>

    <!-- Embossed Cardholder Line -->
    <rect x="140" y="312" width="120" height="10" rx="5" fill="#52525b"/>
    <rect x="280" y="312" width="60" height="10" rx="5" fill="#3f3f46"/>
  </g>
</svg>
